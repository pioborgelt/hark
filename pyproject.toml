[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hark-ww"
version = "0.1.0"
description = "Experimental text-enrolled streaming phoneme wakeword model"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.12,<1", "piper-tts==1.3.0"]

[tool.setuptools.packages.find]
include = ["hark*"]
